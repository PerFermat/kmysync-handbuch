# nginx server-Block fuer das KMySync-Handbuch (kmysync.michaelspahr.de)
# Ablage:  /etc/nginx/sites-available/kmysync.michaelspahr.de   (Symlink in sites-enabled/)
#   ln -s /etc/nginx/sites-available/kmysync.michaelspahr.de /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Nutzt das vorhandene Wildcard-Zertifikat *.michaelspahr.de (deckt die Subdomain ab).
# Pfad des Zertifikats vorher pruefen:  ls -d /etc/letsencrypt/live/*/

# --- HTTP: alles auf HTTPS umleiten ---
server {
    listen 80;
    listen [::]:80;
    server_name kmysync.michaelspahr.de;
    return 301 https://$host$request_uri;
}

# --- HTTPS: Handbuch ausliefern ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;            # nginx >= 1.25.1; die anderen Seiten auf dem Server schreiben es genauso
    server_name kmysync.michaelspahr.de;

    ssl_certificate     /etc/letsencrypt/live/michaelspahr.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelspahr.de/privkey.pem;

    root /var/www/kmysync;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bilder aendern sich nur mit neuem Handbuch-Stand; CSS/JS kurz halten, damit Updates sofort greifen
    location ~* \.(?:webp|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
}
